name: wger-sparky-bridge

services:
  wger-sparky-sync:
    build:
      # Build from this repo so the image always matches the deployed commit
      # (no manual GHCR push / no CI). Requires GH_BUILD_TOKEN (private repo).
      context: https://x-access-token:${GH_BUILD_TOKEN}@github.com/ATECHPCS/wger-sparky-bridge.git#main
      dockerfile: Dockerfile
    image: ghcr.io/atechpcs/wger-sparky-bridge:latest
    # Force a rebuild on deploy; otherwise Compose reuses the cached image.
    pull_policy: build
    container_name: wger-sparky-sync
    restart: unless-stopped
    ports:
      - "3333:3000"
    environment:
      WGER_URL: http://wger-nginx:80
      WGER_API_TOKEN: ${WGER_API_TOKEN}
      SPARKY_URL: http://sparkyfitness-server:3010
      SPARKY_API_KEY: ${SPARKY_API_KEY}
      SYNC_CRON: "0 * * * *"
      # Only push these Sparky measurement categories into wger (keep Garmin/Apple noise out).
      # Sparky/Apple Health weight is kg; wger profile is lb -> convert on sync.
      SPARKY_WEIGHT_KG_TO_LB: "true"
      MEASUREMENT_ALLOWLIST: "Body fat,VO2 Max,resting_heart_rate"
      DATA_DIR: /data
    volumes:
      - sync-data:/data
    networks:
      - wger_default
      - sparkyfitness_default

volumes:
  sync-data:

networks:
  wger_default:
    external: true
  sparkyfitness_default:
    external: true
